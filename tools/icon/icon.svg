<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e23f22"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS の角丸に近い形 -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#shine)"/>

  <!-- コミットグラフ：本流と、分かれて戻ってくるブランチ -->
  <g fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round">
    <path d="M380 250 V774"/>
    <path d="M380 690 C380 560 644 590 644 440 V390"/>
  </g>
  <g fill="#fff">
    <circle cx="380" cy="250" r="74"/>
    <circle cx="380" cy="774" r="74"/>
    <circle cx="644" cy="340" r="74"/>
  </g>
  <!-- ブランチの先端は中空にして「今ここ」に見せる -->
  <circle cx="644" cy="340" r="34" fill="#e8492a"/>

  <!-- ジムのダンベル -->
  <g transform="translate(712 742) rotate(-30) scale(0.78)">
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="#fff"/>
    <rect x="-150" y="-70" width="56" height="140" rx="22" fill="#fff"/>
    <rect x="94" y="-70" width="56" height="140" rx="22" fill="#fff"/>
    <rect x="-196" y="-46" width="40" height="92" rx="16" fill="#fff"/>
    <rect x="156" y="-46" width="40" height="92" rx="16" fill="#fff"/>
  </g>
</svg>
